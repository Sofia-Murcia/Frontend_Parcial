<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesas — Restaurante XYZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div class="app">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="nombre">Restaurante <span>XYZ</span></div>
            <div class="subtitulo">Panel de gestión</div>
        </div>
        <nav>
            <a href="mesas.html"    class="nav-item activo"><span class="icono">🪑</span> Mesas</a>
            <a href="reservas.html" class="nav-item"><span class="icono">📅</span> Reservas</a>
            <a href="productos.html"class="nav-item"><span class="icono">🍽️</span> Productos</a>
            <a href="pedidos.html"  class="nav-item"><span class="icono">🧾</span> Pedidos</a>
        </nav>
        <div class="sidebar-footer">
            <div class="usuario-info">
                <div class="nombre-usr" id="nombreUsuario">—</div>
                <div class="rol-usr"    id="rolUsuario">—</div>
            </div>
            <button class="btn-logout" onclick="logout()"><span class="icono">🚪</span> Cerrar sesión</button>
        </div>
    </aside>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>Mesas</h1>
                <p>Administra las mesas del restaurante</p>
            </div>
            <button class="btn btn-primary" onclick="abrirCrear()">+ Nueva mesa</button>
        </div>

        <div class="filtros">
            <select id="filtroEstado" onchange="cargarMesas()">
                <option value="">Todos los estados</option>
                <option value="disponible">Disponible</option>
                <option value="reservada">Reservada</option>
                <option value="ocupada">Ocupada</option>
                <option value="fuera_servicio">Fuera de servicio</option>
            </select>
        </div>

        <div class="card">
            <div class="tabla-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Número</th>
                            <th>Capacidad</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaMesas">
                        <tr><td colspan="4" class="td-cargando">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div class="modal-overlay oculto" id="modalMesa">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitulo">Nueva mesa</h3>
            <button class="modal-close" onclick="cerrarModal()">✕</button>
        </div>
        <div class="modal-body">
            <form id="formMesa" onsubmit="event.preventDefault(); guardarMesa()">
                <div class="campo">
                    <label>Número o nombre *</label>
                    <input type="text" id="numero" placeholder="Ej: MESA-5" required />
                </div>
                <div class="campo">
                    <label>Capacidad máxima *</label>
                    <input type="number" id="capacidad" min="1" placeholder="Ej: 4" required />
                </div>
                <div class="campo">
                    <label>Estado inicial</label>
                    <select id="estado">
                        <option value="disponible">Disponible</option>
                        <option value="ocupada">Ocupada</option>
                        <option value="reservada">Reservada</option>
                        <option value="fuera_servicio">Fuera de servicio</option>
                    </select>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
            <button class="btn btn-primary"   onclick="guardarMesa()">Guardar</button>
        </div>
    </div>
</div>

<div class="modal-overlay oculto" id="modalEstado">
    <div class="modal">
        <div class="modal-header">
            <h3>Cambiar estado</h3>
            <button class="modal-close" onclick="cerrarModal()">✕</button>
        </div>
        <div class="modal-body">
            <div class="campo">
                <label>Nuevo estado</label>
                <select id="nuevoEstado">
                    <option value="disponible">Disponible</option>
                    <option value="reservada">Reservada</option>
                    <option value="ocupada">Ocupada</option>
                    <option value="fuera_servicio">Fuera de servicio</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
            <button class="btn btn-primary"   onclick="cambiarEstado()">Actualizar</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/mesas.js"></script>
<script>
    verificarSesion();
    const usr = getUsuario();
    if (usr) {
        document.getElementById('nombreUsuario').textContent = usr.nombre;
        document.getElementById('rolUsuario').textContent    = usr.rol;
    }
    cargarMesas();
</script>
</body>
</html>
