<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productos — Restaurante XYZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div class="app">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="nombre">Restaurante <span>XYZ</span></div>
            <div class="subtitulo">Panel de gestión</div>
        </div>
        <nav>
            <a href="mesas.html"    class="nav-item"><span class="icono">🪑</span> Mesas</a>
            <a href="reservas.html" class="nav-item"><span class="icono">📅</span> Reservas</a>
            <a href="productos.html"class="nav-item activo"><span class="icono">🍽️</span> Productos</a>
            <a href="pedidos.html"  class="nav-item"><span class="icono">🧾</span> Pedidos</a>
        </nav>
        <div class="sidebar-footer">
            <div class="usuario-info">
                <div class="nombre-usr" id="nombreUsuario">—</div>
                <div class="rol-usr"    id="rolUsuario">—</div>
            </div>
            <button class="btn-logout" onclick="logout()"><span class="icono">🚪</span> Cerrar sesión</button>
        </div>
    </aside>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>Productos</h1>
                <p>Administra el menú del restaurante</p>
            </div>
            <button class="btn btn-primary" onclick="abrirCrear()">+ Nuevo producto</button>
        </div>

        <div class="filtros">
            <select id="filtroCategoria" onchange="cargarProductos()">
                <option value="">Todas las categorías</option>
            </select>
        </div>

        <div class="card">
            <div class="tabla-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Disponibilidad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductos">
                        <tr><td colspan="5" class="td-cargando">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div class="modal-overlay oculto" id="modalProducto">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitulo">Nuevo producto</h3>
            <button class="modal-close" onclick="cerrarModal()">✕</button>
        </div>
        <div class="modal-body">
            <form id="formProducto" onsubmit="event.preventDefault(); guardarProducto()">
                <div class="campo">
                    <label>Nombre *</label>
                    <input type="text" id="nombre" placeholder="Hamburguesa Especial" required />
                </div>
                <div class="campo">
                    <label>Descripción</label>
                    <textarea id="descripcion" placeholder="Descripción del producto..."></textarea>
                </div>
                <div class="campo-fila">
                    <div class="campo">
                        <label>Precio *</label>
                        <input type="number" id="precio" min="1" step="100" placeholder="28000" required />
                    </div>
                    <div class="campo">
                        <label>Categoría *</label>
                        <select id="categoria_id" required>
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>
                </div>
                <div class="campo">
                    <label>Disponibilidad</label>
                    <select id="disponible">
                        <option value="1">Disponible</option>
                        <option value="0">No disponible</option>
                    </select>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
            <button class="btn btn-primary"   onclick="guardarProducto()">Guardar</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/productos.js"></script>
<script>
    verificarSesion();
    const usr = getUsuario();
    if (usr) {
        document.getElementById('nombreUsuario').textContent = usr.nombre;
        document.getElementById('rolUsuario').textContent    = usr.rol;
    }
    cargarCategorias('filtroCategoria');
    cargarProductos();
</script>
</body>
</html>
