<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservas — Restaurante XYZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div class="app">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="nombre">Restaurante <span>XYZ</span></div>
            <div class="subtitulo">Panel de gestión</div>
        </div>
        <nav>
            <a href="mesas.html"    class="nav-item"><span class="icono">🪑</span> Mesas</a>
            <a href="reservas.html" class="nav-item activo"><span class="icono">📅</span> Reservas</a>
            <a href="productos.html"class="nav-item"><span class="icono">🍽️</span> Productos</a>
            <a href="pedidos.html"  class="nav-item"><span class="icono">🧾</span> Pedidos</a>
        </nav>
        <div class="sidebar-footer">
            <div class="usuario-info">
                <div class="nombre-usr" id="nombreUsuario">—</div>
                <div class="rol-usr"    id="rolUsuario">—</div>
            </div>
            <button class="btn-logout" onclick="logout()"><span class="icono">🚪</span> Cerrar sesión</button>
        </div>
    </aside>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>Reservas</h1>
                <p>Gestiona las reservas de clientes</p>
            </div>
            <button class="btn btn-primary" onclick="abrirCrear()">+ Nueva reserva</button>
        </div>

        <div class="filtros">
            <input type="date" id="filtroFecha" onchange="cargarReservas()" />
            <input type="text" id="filtroCliente" placeholder="Buscar cliente..." oninput="cargarReservas()" class="filtro-busqueda" />
            <select id="filtroEstado" onchange="cargarReservas()">
                <option value="">Todos los estados</option>
                <option value="pendiente">Pendiente</option>
                <option value="confirmada">Confirmada</option>
                <option value="cancelada">Cancelada</option>
                <option value="finalizada">Finalizada</option>
            </select>
        </div>

        <div class="card">
            <div class="tabla-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Personas</th>
                            <th>Mesa</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaReservas">
                        <tr><td colspan="7" class="td-cargando">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div class="modal-overlay oculto" id="modalReserva">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitulo">Nueva reserva</h3>
            <button class="modal-close" onclick="cerrarModal()">✕</button>
        </div>
        <div class="modal-body">
            <form id="formReserva" onsubmit="event.preventDefault(); guardarReserva()">
                <div class="campo-fila">
                    <div class="campo">
                        <label>Nombre cliente *</label>
                        <input type="text" id="nombre_cliente" placeholder="Carlos Ramírez" required />
                    </div>
                    <div class="campo">
                        <label>Teléfono *</label>
                        <input type="text" id="telefono_cliente" placeholder="300 123 4567" required />
                    </div>
                </div>
                <div class="campo-fila">
                    <div class="campo">
                        <label>Fecha *</label>
                        <input type="date" id="fecha" required />
                    </div>
                    <div class="campo">
                        <label>Hora *</label>
                        <input type="time" id="hora" required />
                    </div>
                </div>
                <div class="campo-fila">
                    <div class="campo">
                        <label>Personas *</label>
                        <input type="number" id="cantidad_personas" min="1" placeholder="4" required />
                    </div>
                    <div class="campo">
                        <label>Mesa *</label>
                        <select id="mesa_id" required>
                            <option value="">Cargando...</option>
                        </select>
                    </div>
                </div>
                <div class="campo">
                    <label>Observaciones</label>
                    <textarea id="observaciones" placeholder="Ocasión especial, preferencias..."></textarea>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
            <button class="btn btn-primary"   onclick="guardarReserva()">Guardar</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/reservas.js"></script>
<script>
    verificarSesion();
    const usr = getUsuario();
    if (usr) {
        document.getElementById('nombreUsuario').textContent = usr.nombre;
        document.getElementById('rolUsuario').textContent    = usr.rol;
    }
    cargarReservas();
</script>
</body>
</html>
